costmap_node:
  ros__parameters:
    resolution: 0.1        # metres per cell
    width: 300             # cells (30 m)
    height: 300            # cells (30 m)
    origin_x: -15.0        # metres, puts the robot at the grid centre
    origin_y: -15.0
    inflation_radius: 1.0  # metres
    max_cost: 100          # cost of an obstacle cell (OccupancyGrid max)
